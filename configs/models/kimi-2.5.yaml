# Model preset: Kimi K2.5 via Kimi CLI through Bedrock-Mantle's
# OpenAI-compatible endpoint.
name: kimi-2.5
short_id: kimi-k2-5
provider: bedrock_mantle
harbor_agent_name: kimi-cli
agent_model_name: openai/moonshotai.kimi-k2.5

agent_env:
  # KimiCliPreinstalled reads these from os.environ at construction
  # time; values come from .harbor-agents.env. Listing here is
  # documentation -- the actual passthrough happens automatically.
  KIMI_BEDROCK_BASE_URL: "${KIMI_BEDROCK_BASE_URL}"
  KIMI_BEDROCK_API_KEY: "${KIMI_BEDROCK_API_KEY}"

# Host-side LiteLLMClient routing (Mantle OpenAI-compatible endpoint):
host_litellm:
  model: openai/moonshotai.kimi-k2.5
  api_base_env: KIMI_BEDROCK_BASE_URL
  api_key_env: KIMI_BEDROCK_API_KEY
