# Model preset: Gemini 2.5 Pro via Gemini CLI direct.
name: gemini-2.5-pro
short_id: gemini-2-5-pro
provider: gemini
harbor_agent_name: gemini-cli
agent_model_name: google/gemini-2.5-pro

agent_env:
  GEMINI_CLI_TRUST_WORKSPACE: "true"

# Host-side LiteLLMClient routing (Gemini API direct):
host_litellm:
  model: gemini/gemini-2.5-pro
  api_key_env: GEMINI_API_KEY
