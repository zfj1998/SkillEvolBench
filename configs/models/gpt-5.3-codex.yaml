# Model preset: GPT 5.3 Codex via Codex CLI through Azure OpenAI.
name: gpt-5.3-codex
short_id: gpt-5-3-codex
provider: azure_openai
harbor_agent_name: codex
agent_model_name: openai/gpt-5.3-codex

agent_env:
  OPENAI_BASE_URL: "${AZURE_OPENAI_ENDPOINT}"
  OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
  CODEX_MODEL_PROVIDER: azure_openai
  CODEX_PROVIDER_ENV_KEY: OPENAI_API_KEY
  CODEX_WIRE_API: responses
  # Match the gpt-5.2-codex constraint: pin verbosity=medium so codex CLI
  # doesn't fall back to its "low" default and trip Azure's allow-list.
  CODEX_MODEL_VERBOSITY: medium

# Host-side LiteLLMClient routing (Azure OpenAI v1 endpoint):
host_litellm:
  model: openai/gpt-5.3-codex
  api_base_env: AZURE_OPENAI_ENDPOINT
  api_key_env: AZURE_OPENAI_API_KEY
