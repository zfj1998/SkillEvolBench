# Model preset: Claude Sonnet 4.5 via Bedrock Invoke API.
name: claude-sonnet-4.5
short_id: sonnet-4-5
provider: bedrock
harbor_agent_name: claude-code
# Bedrock requires the cross-region inference-profile id; litellm-style
# ``anthropic/<bare>`` is rejected (see claude-opus-4.5.yaml comment).
agent_model_name: us.anthropic.claude-sonnet-4-5-20250929-v1:0

agent_env:
  CLAUDE_CODE_USE_BEDROCK: "1"
  ANTHROPIC_DEFAULT_SONNET_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0

# Host-side LiteLLMClient routing (for LLMSelfRetriever / SkillAuthor / Judge):
host_litellm:
  model: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
  # Bedrock auto-reads AWS_BEARER_TOKEN_BEDROCK + AWS_REGION from env;
  # no api_base / api_key needed.
