# Ablation: curated_with_revision + always trigger + tier3_required mode.
# Path-B mirror of selfgen_experience_always_with_tier3. Every revision
# MUST bundle at least one Tier-3 file (scripts/ | references/ | assets/)
# under an existing target skill; SKILL.md-only patches are rejected by
# _parse_revision_patch and the fallback chain runs.
#
# Pair with curated_with_revision_always (free_form) to test whether
# forced Tier-3 bundling improves evaluation_sr or just inflates files.
name: curated_with_revision_always_with_tier3
description: Curated v0 + always trigger + tier3_required mode.
track: path-b

skill_init: curated
allow_self_gen_induction: false
allow_zero_shot_creation: false
allow_curated_inject: true

allow_revision: true
allow_retirement: false

use_skill_library: true
skill_retrieval_k: 8

feedback_level: process
feedback_to_skill_text: true

default_strategy: chain_tier3      # mode = tier3_required
revision_trigger: always
max_revisions_per_skill: 8

harbor_agent_name: claude-code
model_name: anthropic/claude-opus-4-5
