# Ablation: curated_with_revision_always but with library_scope=global
# (the inverse of the project default).
#
# All 30 skills (6 envs * 5 families) accumulate in a single library
# across the whole run. Cross-env retrieval is possible -- when running
# an E5 doc task, the retriever sees E1 code skills as candidates and
# may surface them as wrong-skill matches. This is the design that
# `required_skill_hit_rate ~= 0.27` and
# `cross_env_misretrieval_rate ~= 0.83` came from on the old runs.
#
# Pair with the default `curated_with_revision_always` (env-scoped) to
# measure how much SR drops when cross-env interference is let in.
# Strictly an ablation -- not the recommended setting for actual
# benchmark runs.
name: curated_with_revision_always_global_scope
description: Curated v0 + always trigger + GLOBAL library (no env isolation, ablation).
track: path-b

skill_init: curated
allow_self_gen_induction: false
allow_zero_shot_creation: false
allow_curated_inject: true

allow_revision: true
allow_retirement: false

use_skill_library: true
skill_retrieval_k: 8

# === The ablation knob: opt out of env-scope isolation ===
library_scope: global

feedback_level: process
feedback_to_skill_text: true

default_strategy: chain
revision_trigger: always
max_revisions_per_skill: 8

harbor_agent_name: claude-code
model_name: anthropic/claude-opus-4-5
